name: Build native installers

on:
  workflow_dispatch:

env:
  APP_NAME: GlwssaPlusPlus
  APP_VERSION: "1.0.0"   # jpackage requires a purely numeric version
  MAIN_CLASS: Launcher
  IDE_JAR: glwssapp-ide-1.0-SNAPSHOT.jar

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            type: deb
            extra: --linux-shortcut --linux-menu-group Development
          - name: windows
            os: windows-latest
            type: exe
            extra: --win-menu --win-shortcut --win-dir-chooser
          - name: macos
            os: macos-latest   # Apple Silicon (arm64)
            type: dmg
            extra: ""

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Azul Zulu 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: maven

      - name: Install WiX 3 (Windows installer toolchain)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install wixtoolset -y --no-progress

      - name: Build modules and install to local repo
        run: mvn -B -ntp clean install -DskipTests

      - name: Collect runtime dependencies
        run: |
          mvn -B -ntp -pl glwssapp-ide dependency:copy-dependencies \
            -DoutputDirectory="$GITHUB_WORKSPACE/input" \
            -DincludeScope=runtime
          cp "glwssapp-ide/target/$IDE_JAR" input/

      - name: Package with jpackage
        run: |
          mkdir -p dist
          jpackage \
            --type "${{ matrix.type }}" \
            --name "$APP_NAME" \
            --app-version "$APP_VERSION" \
            --input input \
            --main-jar "$IDE_JAR" \
            --main-class "$MAIN_CLASS" \
            --dest dist \
            ${{ matrix.extra }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.name }}
          path: dist/*
          retention-days: 14
